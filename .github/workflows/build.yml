name: Test and build desktop apps
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  desktop:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python -m PyInstaller --noconfirm --clean --windowed --name ParkLoop launcher.py
      - uses: actions/upload-artifact@v4
        with:
          name: ParkLoop-${{ matrix.os }}
          path: dist/
